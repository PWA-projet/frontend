<p-button icon="pi pi-face-smile" [rounded]="true" severity="secondary" [style]="{ padding: '1.5rem' }" (click)="toggleEmojiDialog()"/>

<ch-dialog
  [(visible)]="visible"
  [positions]="dialogPositions"
>
  <ng-container content>
    <ch-emoji-picker
      [height]="450"
      [width]="450"
      (onEmojiSelected)="handleEmojiSelected($event)"
    >
    </ch-emoji-picker>
  </ng-container>
</ch-dialog>
